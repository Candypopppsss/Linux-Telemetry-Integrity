name: validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  syntax-and-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install lint tooling
        run: python -m pip install ruff==0.9.10
      - name: Python syntax
        run: python -m compileall -q src
      - name: Python lint
        run: ruff check src
      - name: C syntax
        run: cc -std=c11 -Wall -Wextra -Werror -fsyntax-only src/proof_of_concept/attempt.c
      - name: Parser and unprivileged workload controls
        run: python -m unittest discover -s src/tests -v
# BPF attachment and .bt compilation require the separate documented VM lab.
